name: Tests
 
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install Poetry
        run: pipx install poetry
 
      - name: Install dependencies
        run: poetry install
 
      - name: Run tests
        run: poetry run pytest -v
 